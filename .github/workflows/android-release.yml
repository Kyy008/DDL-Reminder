name: Android Release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish signed Android release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/android/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run lint && npm test

      - name: Build and sync Android project
        run: npm run build && npx cap sync android

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/ddl-reminder-release.jks
          chmod 600 android/app/ddl-reminder-release.jks

      - name: Build signed APK and AAB
        working-directory: apps/android/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/android/android/app/ddl-reminder-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease bundleRelease

      - name: Verify release signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify \
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Prepare release assets
        run: |
          mkdir -p release
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            release_version="${GITHUB_REF_NAME#android-}"
          else
            release_version="manual-${GITHUB_SHA::7}"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "release/DDL-Reminder-Android-${release_version}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release/DDL-Reminder-Android-${release_version}.aab"
          cd release
          sha256sum *.apk *.aab > SHA256SUMS.txt

      - name: Upload signed build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          path: apps/android/release/*
          if-no-files-found: error

      - name: Remove release keystore
        if: always()
        run: rm -f android/app/ddl-reminder-release.jks

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: DDL Reminder Android ${{ github.ref_name }}
          body: |
            Android 正式签名版本。直接安装请下载 APK；提交应用商店请使用 AAB。

            安装 APK 前请确认设备允许从当前来源安装应用，并可使用 `SHA256SUMS.txt` 校验下载文件。
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: apps/android/release/*
